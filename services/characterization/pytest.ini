[pytest]
# Характеризационные тесты старого core. Каталог свой, потому что services/core менять
# нельзя (правило миграции №1), а пакет `app` подтягивается через sys.path в conftest.py.
testpaths = .
markers =
    db: требует настоящий PostgreSQL (JSONB + FOR UPDATE SKIP LOCKED, SQLite не подойдёт)
filterwarnings =
    # Шум сторонних библиотек не должен прятать наши предупреждения.
    ignore::DeprecationWarning:bs4.*
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*:DeprecationWarning
