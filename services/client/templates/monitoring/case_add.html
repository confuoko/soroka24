{% extends "base.html" %}
{% block title %}Добавить дело{% endblock %}

{% block content %}
  <h1>Поставить дело на мониторинг</h1>
  <p class="hint">Вставьте ссылку на карточку дела на сайте суда.</p>

  <div class="panel">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions">
        <button type="submit">Добавить</button>
        <a class="btn-link" href="{% url 'case_list' %}">Отмена</a>
      </div>
    </form>
  </div>
{% endblock %}
