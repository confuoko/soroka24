{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
  <div class="panel panel--narrow">
    <h1>Вход</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="actions"><button type="submit">Войти</button></div>
    </form>
    <p class="muted" style="margin-top:1.25rem">
      Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрироваться</a>
    </p>
  </div>
{% endblock %}
