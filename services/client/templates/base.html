{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Сорока{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <a class="brand" href="{% url 'home' %}">Сорока</a>
      {% if user.is_authenticated %}
        <nav>
          <a href="{% url 'case_list' %}">Мои дела</a>
          <a href="{% url 'case_add' %}">Добавить дело</a>
        </nav>
        <div class="right">
          <span class="muted">{{ user.username }}</span>
          <form method="post" action="{% url 'web_logout' %}">
            {% csrf_token %}<button class="secondary" type="submit">Выйти</button>
          </form>
        </div>
      {% else %}
        <div class="right">
          <a href="{% url 'web_login' %}">Войти</a>
          <a href="{% url 'signup' %}">Регистрация</a>
        </div>
      {% endif %}
    </header>

    <main>{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
