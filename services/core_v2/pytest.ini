[pytest]
# В старом core конфига pytest не было вовсе — он работал на дефолтах, и импорты `app.*`
# разрешались только потому, что тесты запускали из каталога сервиса. Здесь это задано
# явно.
testpaths = tests
pythonpath = .
markers =
    db: требует настоящий PostgreSQL (JSONB + FOR UPDATE SKIP LOCKED, SQLite не подойдёт)
filterwarnings =
    # Шум сторонних библиотек не должен прятать наши предупреждения.
    ignore::DeprecationWarning:bs4.*
