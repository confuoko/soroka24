# Локальная разработка: docker-compose up  --  поднимает весь каркас одной командой.
#
# Контейнеры:
#   инфраструктура (готовые образы): postgres, rabbitmq, redis, minio
#   core_v2 (FastAPI + Celery):      core-v2-api, core-v2-worker-urgent,
#                                    core-v2-worker-regular, core-v2-beat,
#                                    core-v2-outbox-publisher
#   клиентский сервис (Django):      client-web, client-consumer
#
# Все контейнеры core_v2 собираются из ОДНОГО образа и отличаются только командой:
# воркеры — очередью, которую слушают (-Q urgent / -Q regular), beat — тем, что не
# работает, а раздаёт работу по расписанию.
#
# core-v2-beat нужен в ЕДИНСТВЕННОЙ реплике: два планировщика поставят ночной обход
# дважды, то есть удвоят расход прокси и оплаченной капчи.
#
# Чего здесь нет и почему:
#
#   * сервисов старого core. Он остался на диске как reference implementation — его
#     читают и по нему сверяют поведение, но не запускают. Тесты гоняются локально;
#   * ничего существенного. Оба сервиса собраны целиком; клиентские контейнеры
#     (client-web и client-consumer) идут из ОДНОГО образа и отличаются командой.

# Общие настройки трёх контейнеров core_v2: образ и переменные окружения у них одни,
# различается только команда запуска. Блок вынесен на верхний уровень, чтобы его нельзя
# было принять за ещё один сервис.
x-core-v2: &core-v2
  build: ./services/core_v2
  environment: &core-v2-env
    TZ: ${TZ}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
    DATABASE_URL: ${CORE_V2_DATABASE_URL}
    ADMIN_USERNAME: ${ADMIN_USERNAME}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY}
    # Ночной обход дел на мониторинге. Задаются ВСЕМ контейнерам, а не только beat:
    # час прогона читает планировщик, а разнос и лимит — сама задача, то есть воркер.
    MONITORING_HOUR: ${MONITORING_HOUR}
    MONITORING_SPACING_SECONDS: ${MONITORING_SPACING_SECONDS}
    MONITORING_BATCH_LIMIT: ${MONITORING_BATCH_LIMIT}
    # Публикация изменений наружу. Имена exchange и очереди задаются всем контейнерам, а
    # не только publisher'у: расхождение имён между процессами — худший из возможных
    # багов здесь, сообщения уходили бы в никуда и молча.
    INTEGRATION_BROKER_URL: ${INTEGRATION_BROKER_URL}
    CASE_CHANGES_EXCHANGE: ${CASE_CHANGES_EXCHANGE}
    CASE_CHANGES_QUEUE: ${CASE_CHANGES_QUEUE}
    PUBLISHER_POLL_SECONDS: ${PUBLISHER_POLL_SECONDS}
    PUBLISHER_BATCH_SIZE: ${PUBLISHER_BATCH_SIZE}
    # Ходить на портал только через прокси из таблицы proxy (пустой пул = отказ).
    COURT_PROXY_REQUIRED: ${COURT_PROXY_REQUIRED}
    # Разгадывание капчи на порталах движка msudrf.ru.
    RUCAPTCHA_API_KEY: ${RUCAPTCHA_API_KEY}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
    S3_BUCKET: ${S3_BUCKET}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_REGION: ${S3_REGION}
  volumes:
    - ./services/core_v2:/app
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  # ------------------------------------------------------------------ infra
  # Реляционная БД. Хранит дела, суды, события.
  #
  # TZ здесь НЕ задаём, и это не упущение. Все колонки-моменты — timestamptz, они хранят
  # момент независимо от пояса сессии, так что менять его незачем; а вот выставить сюда
  # Europe/Moscow «для порядка» — значит поменять то, как psql печатает время, и сбить с
  # толку того, кто пойдёт сверять данные руками. Пояс отображения живёт в одном месте —
  # ADMIN_TIMEZONE в services/core_v2/app/admin.py.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Заводит базу core_v2. Отрабатывает только при первой инициализации кластера,
      # то есть на пустом томе postgres_data.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Брокер очередей Celery.
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # management UI: http://localhost:15672
    healthcheck:
      # ping проверяет только что нода жива; check_port_connectivity — что порт 5672
      # уже принимает подключения (иначе воркеры ловят одну transient-ошибку на старте).
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10

  # Хранилище результатов Celery-задач.
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-совместимое хранилище: картинки капчи и отладочный архив HTML страниц суда.
  # Локальная замена облачного S3 — код работает через boto3, в проде меняется только
  # S3_ENDPOINT_URL и ключи.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # web-консоль: http://localhost:9001
    volumes:
      - minio_data:/data

  # Одноразовый контейнер: создаёт бакет и завершается. Ждёт minio в цикле, чтобы не
  # угадывать healthcheck (образ minio/mc минимальный, curl там может не быть).
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    environment:
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY;
             do echo 'ждём minio...'; sleep 2; done;
             mc mb --ignore-existing local/$$S3_BUCKET;
             echo 'бакет' $$S3_BUCKET 'готов'"

  # ---------------------------------------------------------------- core_v2
  # HTTP API: принимает запросы, отдаёт дела и поток изменений. В портал НЕ ходит —
  # это делают воркеры.
  core-v2-api:
    <<: *core-v2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"      # http://localhost:8000/ping, админка на /admin

  # Срочная очередь: только что добавленные пользователем дела — нужен быстрый отклик.
  core-v2-worker-urgent:
    <<: *core-v2
    command: celery -A app.celery_app worker -Q urgent -l info --concurrency=2

  # Рядовая очередь: всё остальное, в том числе ручные переобходы.
  core-v2-worker-regular:
    <<: *core-v2
    command: celery -A app.celery_app worker -Q regular -l info --concurrency=4

  # Планировщик: раз в сутки ставит дела с флагом is_on_monitoring на повторный обход.
  # Сам ничего не обходит — только кладёт задачи в regular.
  #
  # РОВНО ОДНА реплика. Два beat — два ночных прогона, то есть двойной расход прокси и
  # оплаченной капчи на тот же результат.
  #
  # Файл состояния расписания — в /tmp, а не в примонтированном ./services/core_v2:
  # это служебный shelve-файл процесса, ему нечего делать в репозитории (в .gitignore
  # он уже перечислен именно потому, что в старом core лежал не там).
  core-v2-beat:
    <<: *core-v2
    command: >
      celery -A app.celery_app beat -l info
      --schedule=/tmp/celerybeat-schedule

  # Publisher: увозит найденные изменения из integration_outbox_event в очередь
  # case_changes. Сам ничего не обходит и в портал не ходит.
  #
  # Отдельный процесс, а не часть обхода, чтобы сохранение судебных данных не зависело от
  # доступности брокера: упал RabbitMQ — дело всё равно сохранится, а сообщение уедет
  # позже. В этом и весь смысл Transactional Outbox.
  #
  # Реплика нужна одна, но несколько не сломают: порция берётся через
  # FOR UPDATE SKIP LOCKED, поэтому второй publisher возьмёт следующие строки, а не те же.
  core-v2-outbox-publisher:
    <<: *core-v2
    command: python -m app.integration_publisher

  # ------------------------------------------------------- клиентский сервис
  # Обычный Django: пользователи, подписки, UI. Судебных данных у него нет — он берёт их
  # у core по HTTP (CORE_API_URL) и себе НЕ копирует.
  #
  # База своя, отдельная от soroka_core_v2: две ORM на одних таблицах ломаются на каждой
  # миграции. Playwright и браузера в образе нет — на порталы ходит core.
  client-web:
    build: ./services/client
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --reload"
    environment: &client-env
      TZ: ${TZ}
      CLIENT_DATABASE_URL: ${CLIENT_DATABASE_URL}
      CORE_API_URL: ${CORE_API_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      # Подписчику очереди (Phase 5) понадобятся те же имена, что у publisher'а core.
      INTEGRATION_BROKER_URL: ${INTEGRATION_BROKER_URL}
      CASE_CHANGES_EXCHANGE: ${CASE_CHANGES_EXCHANGE}
      CASE_CHANGES_QUEUE: ${CASE_CHANGES_QUEUE}
    volumes:
      - ./services/client:/app
    ports:
      - "8001:8001"      # http://localhost:8001
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Подписчик очереди case_changes: держит соединение открытым и получает факт изменения
  # сразу, как только core его опубликовал. Тот же образ, что у client-web.
  #
  # Реплик может быть несколько, в отличие от publisher'а и beat: RabbitMQ отдаёт каждое
  # сообщение ОДНОМУ подписчику, а обработка идемпотентна.
  #
  # Миграции здесь НЕ накатываем — это делает client-web. Две команды, гоняющие migrate
  # одновременно, боролись бы за блокировку таблицы django_migrations.
  client-consumer:
    build: ./services/client
    command: python manage.py consume_case_events
    environment:
      <<: *client-env
    volumes:
      - ./services/client:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
